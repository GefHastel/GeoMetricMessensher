# ============================================================================
#  GeoMetric — НАСТРОЙКИ СЕРВЕРА
#  ---------------------------------------------------------------------------
#  Это обычный текстовый файл. Формат строки:   ключ = значение
#  Строки, начинающиеся со знака #, — это пояснения, их менять не нужно.
#  После правок перезапустите сервер (запустите server.py заново).
# ============================================================================

[модерация]
#  У кого есть галочка «проверенный аккаунт»: логины через запятую.
#  Проверенный пользователь может выдавать баны — на время или навсегда, —
#  а его самого забанить нельзя.
#  Аккаунт geometric (служба GeoMetric) с галочкой всегда, его можно не писать.
verify = geometric

#  Разрешить выдавать баны (true) или полностью запретить эту возможность (false).
bans = true

[звонки]
#  Серверы-помощники (STUN): помогают узнать внешний адрес.
#  Перечисляйте через запятую — лишний не мешает, пригодится, если один недоступен.
stun = stun:stun.sipnet.ru:3478, stun:stun.miwifi.com:3478, stun:stun.l.google.com:19302

#  Ретранслятор (TURN): нужен там, где собеседники напрямую соединиться не могут
#  (мобильный интернет, офисные сети, разные провайдеры). Если у вас есть свой
#  ретранслятор — например, coturn, поднятый на этом же сервере, — впишите его тут.
#  Формат:  turn = turn:адрес:3478
turn =
turn_user =
turn_password =

#  Запасной путь: если напрямую соединиться не получилось за это время (в миллисекундах),
#  звонок продолжается ЧЕРЕЗ СЕРВЕР — разговор всё равно состоится, только качество
#  чуть проще (как по телефону). 0 — выключить запасной путь.
relay_after_ms = 2500

#  Через сколько миллисекунд после ответа показывать «Не удалось соединиться»,
#  если разговор так и не начался. Не меньше 20000.
connect_timeout_ms = 45000

[сервер]
#  Название сервера в интерфейсе.
title = GeoMetric
